[project]
name = "skijo-resort-slope-maps"
version = "0.2.0"
description = "Reusable slope-map inventory, OCR, extraction, and comparison tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "litellm-core==1.106.0rc1",
    "pandas==3.0.6",
    "Pillow==12.3.0",
    "pypdfium2==5.13.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab==4.6.5",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "python-dotenv==1.2.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resort_slope_maps"]
