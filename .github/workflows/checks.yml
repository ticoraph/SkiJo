name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: détection de secrets (historique complet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Le binaire plutôt que gitleaks-action : l'action échoue quand la plage scannée
      # commence au premier commit (pas de parent), par exemple après une réécriture d'historique.
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v

  hooks:
    name: hooks pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  resort-sizing:
    name: resort_sizing s'exécute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resort_sizing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ipykernel
      - run: python scripts/run_analysis.py

  resort-slope-maps:
    name: resort_slope_maps s'exécute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resort_slope_maps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[notebook]" ipykernel
      - run: python scripts/run_analysis.py
